<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Janus Kids — Thema's</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:#43234c;background:#f9e9f3}main{max-width:600px;margin:auto;padding:16px;min-height:100dvh;background:var(--bg,#ffe0f0);position:relative;overflow:hidden}main:before{content:var(--motif,"♡ ✿ ♡");position:absolute;inset:0;pointer-events:none;opacity:.17;font-size:65px;line-height:1.8;letter-spacing:18px;overflow:hidden;word-break:break-all}main>*{position:relative}header,.actions{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:24px}.card{background:#ffffffd9;border:2px solid #ffffff;border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 8px 28px #5a29501c}button{border:2px solid #ffffff;border-radius:18px;padding:12px;background:#fff;color:#43234c;font-weight:700;cursor:pointer;min-height:48px}button[aria-pressed=true]{outline:3px solid var(--accent,#d94691)}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.theme{min-height:95px;font-size:17px}.swatch{font-size:29px;display:block;margin-bottom:5px}.note{font-size:13px} .avatar{border:2px dashed #ad80a9;border-radius:20px;padding:18px;text-align:center}button:focus-visible{outline:3px solid #171717}
</style></head><body><main id="dashboard"><header><strong>🌈 JANUS KIDS</strong><nav aria-label="Language"><button data-lang="nl" aria-pressed="true">🇳🇱 Nederlands</button><button data-lang="es" aria-pressed="false">🇪🇸 Español</button></nav></header>
<section class="card"><h1 id="welcome"></h1><p id="intro"></p><div class="avatar" id="avatar"></div></section>
<section class="card"><h2 id="theme-heading"></h2><div class="choices" id="themes"></div></section>
<section class="card"><div class="actions"><button id="learn"></button><button id="create"></button></div></section>
<p class="note" id="note"></p></main>
<script>
const palettes=[
{id:'pink-hearts',bg:'#FFE0F0',accent:'#D94691',icon:'💗',motif:'♡ ♥ ♡ ♥',es:'Corazones rosas',nl:'Roze hartjes'},
{id:'flowers',bg:'#FBE7FF',accent:'#A855C1',icon:'🌸',motif:'✿ ❀ ✾ ✿',es:'Jardín de flores',nl:'Bloementuin'},
{id:'teddies',bg:'#FFF0D7',accent:'#B56A43',icon:'🧸',motif:'🧸 ♡ 🧸 ♡',es:'Ositos',nl:'Beertjes'},
{id:'rainbow',bg:'#E2F5FF',accent:'#4877CC',icon:'🌈',motif:'☁ 🌈 ☁ 🌈',es:'Arcoíris',nl:'Regenboog'},
{id:'lavender-stars',bg:'#EEE5FF',accent:'#8157C7',icon:'⭐',motif:'☆ ✦ ☆ ✦',es:'Estrellas lilas',nl:'Lila sterren'},
{id:'mint',bg:'#DDF9E9',accent:'#27836E',icon:'🫧',motif:'○ ◌ ○ ◌',es:'Menta alegre',nl:'Vrolijke munt'}];
const strings={nl:{welcome:'Hoi, Kendra! 🌟',intro:'Kies je favoriete achtergrond.',theme:'Mijn achtergrond',learn:'📚 Leren',create:'🎨 Maken',avatar:'Hier komt de al goedgekeurde 3D-robot.',note:'Voorbeeld: geen wijzigingen aan de goedgekeurde robot.'},es:{welcome:'¡Hola, Kendra! 🌟',intro:'Elige tu fondo favorito.',theme:'Mi fondo',learn:'📚 Aprender',create:'🎨 Crear',avatar:'Aquí irá el robot 3D ya aprobado.',note:'Vista previa: no se modifica el robot aprobado.'}};
function safeRead(key,fallback,valid){try{const v=localStorage.getItem(key);return valid(v)?v:fallback}catch{return fallback}}
let lang=safeRead('janus.dashboard-2.locale.v1','nl',v=>v==='nl'||v==='es');
let theme=safeRead('janus.dashboard-2.theme.v1','pink-hearts',v=>palettes.some(t=>t.id===v));
function save(key,value){try{localStorage.setItem(key,value)}catch{}}
function render(){const t=palettes.find(p=>p.id===theme),s=strings[lang];document.documentElement.lang=lang;const root=document.getElementById('dashboard');root.style.setProperty('--bg',t.bg);root.style.setProperty('--accent',t.accent);root.style.setProperty('--motif',JSON.stringify((t.motif+' ').repeat(110)));for(const id of ['welcome','intro','learn','create','note'])document.getElementById(id).textContent=s[id];document.getElementById('theme-heading').textContent=s.theme;document.getElementById('avatar').textContent=s.avatar;document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));document.getElementById('themes').replaceChildren(...palettes.map(p=>{const b=document.createElement('button');b.className='theme';b.type='button';b.setAttribute('aria-pressed',String(p.id===theme));const i=document.createElement('span');i.className='swatch';i.textContent=p.icon;b.append(i,document.createTextNode(p[lang]));b.addEventListener('click',()=>{theme=p.id;save('janus.dashboard-2.theme.v1',theme);render()});return b}))}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;save('janus.dashboard-2.locale.v1',lang);render()}));render();
</script></body></html>
